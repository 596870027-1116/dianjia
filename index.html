function fmt(v){ return v===null||v===undefined||v==='' ? '—' : (Math.round(v*1000)/1000).toString(); }
function num(v){ return (typeof v==='number') ? v : null; }
function gapClass(g){ return g>=0.7?'gap-big':(g>=0.5?'gap-mid':'gap-low'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function voltList(){

    s.add(b);
  });
  var arr=Array.from(s).sort(function(a,b){return a.localeCompare(b,'zh');});
  fVolt.innerHTML='';
  var o=document.createElement('option'); o.value=''; o.textContent='全部电压等级'; fVolt.appendChild(o);
  arr.forEach(function(v){ var oo=document.createElement('option'); oo.value=v; oo.textContent=v; fVolt.appendChild(oo); });
}

function renderPolicy(p){
  var box=document.getElementById('policyCard');
  if(!p){ box.innerHTML=''; return; }
  var pol = POLICY[p];
  if(!pol){
    box.innerHTML = '<div class="policy"><h3>📜 电价政策（'+esc(p)+'）</h3><div class="pending">政策信息待补充 —— 电价数据更新时将同步整理（文件/文号/时段/执行时间）</div></div>';
    return;
  }
  var h = '<div class="policy"><h3>📜 电价政策 · '+esc(p)+'</h3>';
  h += '<div class="doc">文件：<b>《'+esc(pol['文件'])+'》</b>（'+esc(pol['文号'])+'）</div>';
  h += '<div class="doc">发布时间：'+esc(pol['发布'])+'</div>';
  h += '<div class="exec"><span class="tag">执行时间</span><b>'+esc(pol['执行'])+'</b></div>';
  h += '<table><tr><th>季节/月份</th><th>尖峰</th><th>高峰</th><th>平段</th><th>低谷</th></tr>';
  Object.keys(pol['时段']).forEach(function(k){
    var t = pol['时段'][k];
    h += '<tr><td>'+esc(k)+'</td><td>'+esc(t['尖峰']||'—')+'</td><td>'+esc(t['高峰']||'—')+'</td><td>'+esc(t['平段']||'—')+'</td><td>'+esc(t['低谷']||'—')+'</td></tr>';
  });
  h += '</table>';
  h += '<div class="float">浮动比例：'+esc(pol['浮动'])+'</div>';
  h += '<ul class="notes">'+(pol['备注']||[]).map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul>';
  h += '</div>';
  box.innerHTML = h;
}

function render(){
  var p=fProv.value, cat=document.getElementById('fCat').value, vv=fVolt.value;
  var m1=fM1.value, m2=fM2.value;
  var tbody=document.getElementById('tbody'); tbody.innerHTML='';
  var rows=[], n=0, gaps=[];
  DATA.forEach(function(r){
    if(p && r[0]!==p) return;
    if(cat && r[1].indexOf(cat)!==0) return;
    if(vv && r[1]!==vv) return;
    if(r[2]<m1 || r[2]>m2) return;
    rows.push(r);
  });
  window._rows = rows;
  rows.forEach(function(r){
    var jf=num(r[3]), gf=num(r[4]), pf=num(r[5]), df=num(r[6]), xl=num(r[8]), rl=num(r[9]);
    var has = (jf!==null)||(gf!==null)||(pf!==null)||(df!==null);
    var gap = (gf!==null&&df!==null)? gf-df : null;
    var jgap = (jf!==null&&df!==null)? jf-df : null;
    if(gap!==null) gaps.push(gap);
    var tr=document.createElement('tr');
    if(!has) tr.className='empty';
    var cells = [
      '<td class="l prov">'+esc(r[0])+'</td>',
      '<td class="l">'+esc(r[1])+'</td>',
      '<td class="month">'+r[2]+'</td>',
      '<td>'+(jf===null?'—':fmt(jf))+'</td>',
      '<td>'+(gf===null?'—':fmt(gf))+'</td>',
      '<td>'+(pf===null?'—':fmt(pf))+'</td>',
      '<td>'+(df===null?'—':fmt(df))+'</td>',
      gap===null ? '<td>—</td>' : '<td class="'+gapClass(gap)+'">'+fmt(gap)+'</td>',
      jgap===null ? '<td>—</td>' : '<td class="'+gapClass(jgap)+'">'+fmt(jgap)+'</td>',
      '<td>'+(xl===null?'—':fmt(xl))+'</td>',
      '<td>'+(rl===null?'—':fmt(rl))+'</td>'
    ];
    tr.innerHTML = cells.join('');
    tbody.appendChild(tr);
    n++;
  });
  if(rows.length===0){
    var tr=document.createElement('tr');
    tr.innerHTML='<td colspan="11" style="text-align:center;color:#9aa5b1;padding:20px;">无匹配数据</td>';
    tbody.appendChild(tr);
  }
  var avg = gaps.length? (gaps.reduce(function(a,b){return a+b;},0)/gaps.length) : null;
  var mx = gaps.length? Math.max.apply(null, gaps) : null;
  var sb = document.getElementById('statbar');
  sb.innerHTML = '共 <b>'+n+'</b> 条 · 有价差数据 <b>'+gaps.length+'</b> 条 · 平均峰谷价差 <b class="'+(avg>=0.7?'red':'')+'">'+(avg===null?'—':fmt(avg))+'</b> 元/kWh · 最大 <b class="red">'+(mx===null?'—':fmt(mx))+'</b>';
  renderPolicy(p);
  renderTrend(p, vv);
}

function renderTrend(p, vv){
  var box=document.getElementById('trend');
  if(!p || !vv){ box.innerHTML=''; return; }
  var sel = [];
  DATA.forEach(function(r){
    if(r[0]===p && r[1]===vv){ sel.push(r); }
  });
  var pairs = sel.map(function(r){
    var gf=num(r[4]), df=num(r[6]);
    return {m:r[2], g:(gf!==null&&df!==null)? gf-df : null};
  }).filter(function(x){ return x.g!==null; }).sort(function(a,b){return a.m<b.m?-1:1;});
  if(pairs.length<2){ box.innerHTML=''; return; }
  var mx = Math.max.apply(null, pairs.map(function(x){return x.g;}));
  var h = '<div class="trend-title">📈 '+esc(p)+' · '+esc(vv)+' · 逐月峰谷价差走势（元/kWh）</div><div class="trend-box">';
  pairs.forEach(function(x){
    var w = Math.max(2, Math.round(x.g/mx*100));
    var c = x.g>=0.7?'#c00000':(x.g>=0.5?'#e08a00':'#4a90d9');
    h += '<div class="trend-row"><span class="m">'+x.m+'</span><div class="bar" style="width:'+w+'%;background:'+c+'"></div><span class="v">'+fmt(x.g)+'</span></div>';
  });
  h += '</div>';
  box.innerHTML = h;
}

});
voltList(); render();
function copyTable(){
  var rows = window._rows || [];
  var head = ['地区','电价制度/电压','月份','尖峰','高峰','平段','低谷','峰谷价差','尖谷价差','需量(元/kW·月)','容量(元/kVA·月)'];
  var lines = [head.join('\t')];
  rows.forEach(function(r){
    var jf=num(r[3]), gf=num(r[4]), pf=num(r[5]), df=num(r[6]), xl=num(r[8]), rl=num(r[9]);
    var gap = (gf!==null&&df!==null)? (gf-df).toFixed(4) : '';
    var jgap = (jf!==null&&df!==null)? (jf-df).toFixed(4) : '';
    var f = function(v){ return v===null ? '' : v.toFixed(4); };
    lines.push([r[0], r[1], r[2], f(jf), f(gf), f(pf), f(df), gap, jgap, f(xl), f(rl)].join('\t'));
  });
  var text = lines.join('\n');
  var ok = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ ok=true; toast('已复制 ' + rows.length + ' 行到剪贴板'); }).catch(function(){ legacyCopy(text); });
  } else { legacyCopy(text); }
  function legacyCopy(txt){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制 ' + rows.length + ' 行到剪贴板'); }catch(e){ toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='show';
  setTimeout(function(){ t.className=''; }, 2200);
}
</script>
<style>#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0f3460;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25);}
#toast.show{opacity:1;}
#copyBtn{margin-left:auto;background:#0f3460;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;}
#copyBtn:hover{background:#c00000;}</style>
